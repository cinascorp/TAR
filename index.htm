╔═══════════════════════════════════════════════════════════════╗
║  T∆R — The Airway Reconstruction                                         ║
║  Browser-Native Passive Airspace Reconstruction & Anomaly Detect         ║
║                                                                          ║
║  Author:  Cina Naqshbandi  (cinascorp@gmail.com)                         ║
║  Repo:    https://github.com/cinascorp/TAR                               ║
║  Live:    https://cinascorp.github.io/TAR                                ║
║                                                                          ║
║  Single-file HTML application. No build step, no backend required for    ║
║  standalone deployment. Optional same-origin /api/feed aggregator for    ║
║  dev environments where public CORS proxies are blocked.                 ║
║                                                                          ║
║  ARCHITECTURE OVERVIEW                                                   ║
║   • Map rendering:    OpenLayers 10 (vector + tile layers)               ║
║   • UI framework:     Bootstrap 5 offcanvas panels + floating buttons    ║
║   • Data sources:     FR24 + OpenSky + adsb.lol (multi-feed aggregator)  ║
║   • Motion model:     Constant-velocity dead reckoning (pos += vel*dt)   ║
║   • Latency comp:     Predict forward by dataAge (now - f.ts)            ║
║   • Geodesics:        WGS84 ellipsoid + EGM2008 geoid undulation         ║
║   • Signal analysis:  T∆R-Q quantum module (SNR_blob, ghost, shadow)     ║
║   • i18n:             English ⇄ فارسی (RTL)                              ║
║                                                                          ║
║  PHASE 1 (current): 2D OpenLayers + SVG aircraft icons                   ║
║  PHASE 2 (future):  3D map + GLTF aircraft models (G3DMAP)               ║
╚═══════════════════════════════════════════════════════════════╝
-->

<div class="offcanvas-header">
<h5 class="offcanvas-title" data-i18n="advHelpTitle">
  T∆R — Advanced Help 
</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
<div class="offcanvas-body">
  <div class="tar-hero">
    <h1 id="tarSecretLogo">T∆R</h1>
    <div class="subtitle" data-i18n="heroSubtitle">The Airlines Reconstruction</div>
  </div>
<div class="tar-section">
<h3 data-i18n="overview">Overview</h3>
<p>T∆R is a real-time aerial traffic recognition and tracking system. It ingests live ADS-B / MLAT / FLARM feeds,cross-checks every contact against the military fleet index,classifies it (Passenger,Commercial,Private,Helicopter,Military Fighter / Transport / Bomber,Drone/UAV,Glider or High-Altitude),and renders it on an interactive map with altitude-based color encoding. </p></div>

<div class="tar-section">
<h3 data-i18n="altSpectrum">Altitude Color Spectrum</h3>
<p>Each color step represents <strong>1500 meters</strong>of altitude (0 – 12,0 m standard band):</p>

<div class="spectrum-bar"></div>

<ul class="mt-2">
  <li><span style="color:#666">■</span><code>#666666</code>Gray — ground level </li>
  <li><span style="color:#FFA500">■</span><code>#FFA500</code>Orange — 0 – 1500 m </li>
  <li><span style="color:#FFFF00">■</span><code>#FFFF00</code>Yellow — 1500 – 3000 m </li>
  <li><span style="color:#00FF00">■</span><code>#00FF00</code>Green — 4500 – 6000 m </li>
  <li><span style="color:#0000FF">■</span><code>#0000FF</code>Blue — 6000 – 7500 m </li>
  <li><span style="color:#4B0082">■</span><code>#4B0082</code>Indigo — 7500 – 9000 m </li>
  <li><span style="color:#800080">■</span><code>#800080</code>Purple — 9000 – 10500 m </li>
  <li><span style="color:#FF00FF">■</span><code>#FF00FF</code>Fuchsia — 10500 – 12000 m </li>
</ul>

<div class="spectrum-divider"></div>
<p style="color:var(--c8)">
  <strong>High-Altitude Contacts (&gt;30 km):</strong>
<strong style="color:#FF69B4">Pink</strong>and <strong style="color:#00FFFF">Cyan</strong>are reserved for stratospheric / near-space vehicles:balloons,classified reconnaissance platforms,experimental UAVs. Color alternates per-contact via altitude hash. </p>
</div>

<div class="tar-section">
  
<h3 data-i18n="catFilters">Category Filters</h3>
<ul>
  <li><strong style="color:var(--passenger)">Passenger</strong>— Scheduled airline flights (IATA-style callsigns) </li>
  <li><strong style="color:var(--commercial)">Commercial</strong>— Cargo / charter / uncategorized civilian </li>
  <li><strong style="color:var(--private)">Private</strong>— General aviation,GA tail-number patterns </li>
  <li><strong>Helicopter</strong>— Rotorcraft (low speed+low altitude+HELI callsign) </li>
  <li><strong style="color:var(--mil)">Military</strong>— Verified via MIL-SYNC hex DB+callsign prefixes+mil serials </li>
  <li><strong style="color:var(--mil)">Fighter</strong>— F-15/16/22/35,Typhoon,Rafale,Su-27/35,MiG-29… (pulsing reticle) </li>
  <li><strong style="color:var(--milt)">Mil Transport</strong>— C-5/C-17/C-130,A400M,KC-135/10/46,IL-76,AN-124… </li>
  <li><strong style="color:var(--milb)">Bomber</strong>— B-1/B-2/B-52/B-21 (flying wing) </li>
  <li><strong>Drone / UAV</strong>— Unmanned aerial vehicles incl. military UAV types </li>
  <li><strong style="color:var(--glider)">Glider</strong>— Sailplanes (GLID type code,D-K / PH-numbered registrations) </li><li><strong style="color:var(--c8)">High-Altitude</strong>— Contacts above 30 km (Pink/Cyan) </li>
</ul>
<p>Buttons:<code>Show All</code>· <code>Hide All</code>· <code>Civilian</code>· <code>Military</code>only · <code>UAV</code>only. </p>
</div>

<div class="tar-section">
  <h3 data-i18n="dataParams">Flight Data Array Parameters</h3><p>Each contact arrives as an indexed array. Canonical layout:</p>
<table class="param-table">
  <thead>

      </tr>

      <td>degrees</td>
      </tr>
    <tr><td>3</td>

    <td>degrees</td>
    </tr>
    <tr>

      <td>feet</td>
      </tr>

      <tr><td>6</td><td>squawk</td><td>Transponder squawk code</td><td>4-digit</td></tr><tr><td>7</td><td>radar</td><td>Radar / source identifier</td><td>string</td></tr><tr><td>8</td><td>type</td><td>ICAO aircraft type code</td><td>e.g. A332</td></tr><tr><td>9</td><td>registration</td><td>Tail number</td><td>string</td></tr><tr><td>10</td><td>timestamp</td><td>Unix timestamp of last update</td><td>seconds</td></tr><tr><td>11</td><td>origin</td><td>Origin airport IATA code</td><td>e.g. MEL</td></tr><tr><td>12</td><td>destination</td><td>Destination airport IATA</td><td>e.g. SIN</td></tr><tr><td>13</td><td>flight</td><td>Displayed flight number</td><td>e.g. QF35</td></tr><tr><td>14</td><td>vertical_rate</td><td>Vertical speed</td><td>ft/min</td></tr><tr><td>15</td><td>baro_rate</td><td>Barometric rate / altitude difference</td><td>number</td></tr><tr><td>16</td><td>callsign</td><td>Transmitted callsign</td><td>e.g. QFA35</td></tr><tr><td>17</td><td>on_ground</td><td>Ground flag</td><td>0 / 1</td></tr><tr><td>18</td><td>airline</td><td>Airline ICAO code</td><td>e.g. QFA</td></tr></tbody></table>
        
<p class="mt-2">
  <em>Note:Some indices may be empty or shifted depending on feed version,but the order above is the canonical format.</em></p>
</div>

<div class="tar-section">
  <h3 data-i18n="symbols">Symbols</h3>
  <ul>
    <li><span class="icon-swatch" id="legend-fighter-help" style="width:22px;height:22px;display:inline-block;vertical-align:middle"></span>Fighter jet — targeting reticle,pulses red </li><li><span class="icon-swatch" id="legend-transport-help" style="width:20px;height:20px;display:inline-block;vertical-align:middle"></span>Heavy military transport / tanker (T-tail,4 engines) </li><li><span class="icon-swatch" id="legend-bomber-help" style="width:20px;height:20px;display:inline-block;vertical-align:middle"></span>Bomber — flying wing,slow red pulse </li><li><span class="icon-swatch" id="legend-glider-help" style="width:22px;height:22px;display:inline-block;vertical-align:middle"></span>Glider / sailplane — cyan,long slender wings </li><li><span class="icon-swatch" id="legend-heli-help" style="width:20px;height:20px;display:inline-block;vertical-align:middle"></span>Helicopter (red tint=military rotorcraft) </li><li><span class="icon-swatch" id="legend-drone-help" style="width:20px;height:20px;display:inline-block;vertical-align:middle"></span>Drone / UAV (quad-X shape) </li><li>Airplane icon (color-coded by altitude) — Passenger / Commercial / Private;red tint=other military </li><li>Pink / Cyan airplane — High-Altitude contact (&gt;30 km)</li></ul>
</div>
    
<div class="tar-section">
  <h3 data-i18n="controls">Controls</h3>
  <ul><li><strong>☰</strong>— Open Settings &amp;Filters panel</li><li><strong>L</strong>— Toggle dark / light map tiles</li><li><strong>?</strong>— Open this Help panel</li><li><strong>FA / EN</strong>— Switch language (English ⇄ فارسی) </li><li><strong>MIL-SYNC</strong>— Force re-sync of the military DB </li><li><strong>Click</strong>a flight marker — open details popup &amp;toggle track </li><li><strong>Refresh</strong>— Force data refresh</li><li><strong>Auto Update</strong>— Toggle background polling</li><li><strong>Proxy</strong>— Route requests through CORS proxies </li><li><strong>Search</strong>— Filter flights by callsign / hex / registration </li></ul>
